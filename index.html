<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>股票投資模擬器</title>
<style>
  :root { --user: #4dabf7; --buyHold: #da77f2; --dca: #ffa94d; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #ddd; }
  header { display: flex; gap: 16px; align-items: center; padding: 8px 12px; flex-wrap: wrap; }
  button { background: #333; color: #ddd; border: 1px solid #555; padding: 4px 10px; cursor: pointer; }
  button.active { background: #555; border-color: #999; }
  main { display: flex; height: calc(100vh - 48px); }
  #chart-wrap { position: relative; flex: 3; min-width: 0; }
  #chart { display: block; width: 100%; height: 100%; cursor: crosshair; }
  #chart.dragging { cursor: grabbing; }
  #latest { position: absolute; right: 72px; top: 8px; }
  aside { flex: 1; min-width: 260px; padding: 8px 12px; overflow-y: auto; border-left: 1px solid #333; font-size: 13px; }
  aside h3 { margin: 12px 0 6px; font-size: 14px; }
  aside input { width: 90px; background: #222; color: #ddd; border: 1px solid #555; padding: 3px 6px; }
  aside .row { display: flex; gap: 6px; align-items: center; margin: 4px 0; flex-wrap: wrap; }
  aside dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0; }
  aside dd { margin: 0; text-align: right; }
  #buy, #m-buy { background: #6b1d1d; } #sell, #m-sell { background: #1d4d2a; }
  #order-msg { color: #ffa94d; min-height: 1.2em; }
  .swatch { display: inline-block; width: 10px; height: 3px; vertical-align: middle; margin-right: 4px; }
  aside label { cursor: pointer; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 2px 4px; text-align: right; border-bottom: 1px solid #222; }
  /* 手機版專用元素，桌面版不顯示 */
  .m-only, .tabs, #m-actions, #backdrop, #sheet-close { display: none; }

  @media (max-width: 768px) {
    html { touch-action: pan-y; } /* 只允許上下捲動，避免兩指捏合或連點兩下誤觸頁面縮放 */
    body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
    main { display: contents; }
    #chart-wrap { order: 1; flex: none; height: 55vh; height: 55dvh; }
    #chart { touch-action: none; } /* 圖表上的手勢全部交給圖表自己處理 */
    header { order: 2; gap: 4px 10px; padding: 6px 8px; font-size: 13px; border-top: 1px solid #333; }
    header .m-only { display: inline; }
    aside { order: 3; flex: 1; min-width: 0; min-height: 0; padding: 0 8px 72px; border-left: none; border-top: 1px solid #333; }
    aside input { font-size: 16px; } /* 小於 16px 時 iOS 聚焦輸入框會自動放大頁面 */
    .tabs { display: flex; position: sticky; top: 0; z-index: 1; background: #111; }
    .tabs button { flex: 1; padding: 8px; border-width: 0 0 2px; border-color: transparent; background: none; }
    .tabs button.active { border-color: #ddd; background: none; }
    aside section[data-tab] { display: none; }
    aside section[data-tab].current { display: block; }
    aside section[data-tab] h3 { display: none; }
    #m-actions { display: flex; position: fixed; left: 0; right: 0; bottom: 0; gap: 8px; padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); background: #111; border-top: 1px solid #333; }
    #m-actions button { flex: 1; padding: 12px; font-size: 18px; }
    #order { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; padding: 4px 12px calc(12px + env(safe-area-inset-bottom)); background: #1a1a1a; border-top: 1px solid #444; transform: translateY(100%); transition: transform 0.2s; }
    body.sheet-open #order { transform: none; }
    #order[data-side="buy"] #sell, #order[data-side="sell"] #buy { display: none; }
    #order #buy, #order #sell { flex: 1; padding: 12px; font-size: 18px; }
    #sheet-close { display: inline-block; float: right; margin-top: 8px; }
    #backdrop { display: block; position: fixed; inset: 0; z-index: 2; background: rgba(0, 0, 0, 0.5); opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    body.sheet-open #backdrop { opacity: 1; pointer-events: auto; }
  }
</style>
</head>
<body>
<header>
  <button id="play">暫停</button>
  <span>
    <button data-speed="1" class="active">1x</button>
    <button data-speed="5">5x</button>
    <button data-speed="20">20x</button>
  </span>
  <button id="reveal">揭曉：關</button>
  <span>現價 <b id="price"></b></span>
  <span class="m-only">漲跌 <b id="change"></b></span>
  <span class="m-only">總資產報酬 <b id="ret-bar"></b></span>
  <span>種子 <b id="seed"></b></span>
</header>
<main>
<div id="chart-wrap">
  <canvas id="chart"></canvas>
  <button id="latest" hidden>回到最新</button>
</div>
<aside>
  <nav class="tabs">
    <button data-tab-btn="position" class="active">部位</button>
    <button data-tab-btn="performance">績效</button>
    <button data-tab-btn="trades">交易紀錄</button>
  </nav>
  <section id="order" data-side="buy">
  <button id="sheet-close">✕</button>
  <h3>市價單</h3>
  <div class="row">
    <input id="qty" type="number" min="1" step="1" value="1000"> 股
    <button id="lot">1 張</button>
    <button id="all-in">全部資金</button>
  </div>
  <div id="estimate"></div>
  <div class="row">
    <button id="buy">買進</button>
    <button id="sell">賣出</button>
  </div>
  <div id="order-msg"></div>
  </section>

  <section data-tab="position" class="current">
  <h3>部位</h3>
  <dl>
    <dt>股數</dt><dd id="pos-shares"></dd>
    <dt>平均成本</dt><dd id="pos-avg"></dd>
    <dt>現金</dt><dd id="pos-cash"></dd>
    <dt>總資產</dt><dd id="pos-total"></dd>
    <dt>未實現損益</dt><dd id="pos-unrealized"></dd>
    <dt>已實現損益</dt><dd id="pos-realized"></dd>
  </dl>
  </section>

  <section data-tab="performance">
  <h3>績效</h3>
  <dl>
    <dt><span class="swatch" style="background: var(--user)"></span>我的報酬率</dt><dd id="ret-user"></dd>
    <dt><label><input type="checkbox" id="show-buyHold" checked style="width: auto"><span class="swatch" style="background: var(--buyHold)"></span>買進持有</label></dt><dd id="ret-buyHold"></dd>
    <dt><label><input type="checkbox" id="show-dca" checked style="width: auto"><span class="swatch" style="background: var(--dca)"></span>定期定額</label></dt><dd id="ret-dca"></dd>
  </dl>
  </section>

  <section data-tab="trades">
  <h3>交易紀錄</h3>
  <table>
    <thead><tr><th>交易日</th><th>買/賣</th><th>股數</th><th>成交價</th><th>手續費</th><th>證交稅</th></tr></thead>
    <tbody id="trades"></tbody>
  </table>
  </section>
</aside>
</main>
<div id="backdrop"></div>
<div id="m-actions">
  <button id="m-buy">買進</button>
  <button id="m-sell">賣出</button>
</div>
<script src="sim-core.js"></script>
<script>
  const { createGame, TICKS_PER_DAY } = SimCore;
  const MS_PER_DAY_1X = 10000;
  const MIN_VISIBLE = 20;
  const AXIS_W = 60;
  const UP = '#e03131', DOWN = '#2f9e44';
  // 揭曉用的中性淡色，不使用紅綠，避免和 K 棒混淆
  const STATE_BANDS = {
    bull: { fill: 'rgba(90, 140, 255, 0.10)', label: '多頭' },
    bear: { fill: 'rgba(180, 110, 255, 0.10)', label: '空頭' },
    sideways: { fill: 'rgba(200, 200, 200, 0.05)', label: '盤整' },
  };

  // 資產曲線的線色，和績效區的色塊一致
  const SERIES_COLORS = { user: '#4dabf7', buyHold: '#da77f2', dca: '#ffa94d' };

  const game = createGame();
  const showBenchmark = { buyHold: true, dca: true };
  let playing = true;
  let reveal = false;
  let speed = 1;
  let pendingTicks = 0;
  let lastTime = null;

  document.getElementById('seed').textContent = game.seed;
  const playBtn = document.getElementById('play');
  playBtn.onclick = () => {
    playing = !playing;
    playBtn.textContent = playing ? '暫停' : '播放';
  };
  const revealBtn = document.getElementById('reveal');
  revealBtn.onclick = () => {
    reveal = !reveal;
    revealBtn.textContent = reveal ? '揭曉：開' : '揭曉：關';
    revealBtn.classList.toggle('active', reveal);
  };
  document.querySelectorAll('[data-speed]').forEach((btn) => {
    btn.onclick = () => {
      speed = Number(btn.dataset.speed);
      document.querySelectorAll('[data-speed]').forEach((b) => b.classList.toggle('active', b === btn));
    };
  });

  const $ = (id) => document.getElementById(id);
  const money = (n) => Math.round(n).toLocaleString('zh-TW');
  const REJECT = {
    'insufficient-cash': '現金不足',
    'insufficient-shares': '持有股數不足',
    'invalid-shares': '請輸入正整數股數',
  };
  const qtyInput = $('qty');
  const qty = () => Number(qtyInput.value);
  const validQty = () => Number.isInteger(qty()) && qty() > 0;

  $('lot').onclick = () => { qtyInput.value = 1000; };
  $('all-in').onclick = () => { qtyInput.value = game.maxBuyShares(); };
  function placeOrder(side) {
    const result = game.order({ side, shares: qty() });
    $('order-msg').textContent = result.ok ? '' : REJECT[result.reason];
    if (result.ok) closeSheet();
  }

  // 手機版：底部按鈕滑出市價單面板，面板只顯示按下的那一邊
  function openSheet(side) {
    $('order').dataset.side = side;
    $('order-msg').textContent = '';
    document.body.classList.add('sheet-open');
  }
  function closeSheet() { document.body.classList.remove('sheet-open'); }
  $('m-buy').onclick = () => openSheet('buy');
  $('m-sell').onclick = () => openSheet('sell');
  $('sheet-close').onclick = closeSheet;
  $('backdrop').onclick = closeSheet;

  // 手機版：部位、績效、交易紀錄分頁切換
  document.querySelectorAll('[data-tab-btn]').forEach((btn) => {
    btn.onclick = () => {
      document.querySelectorAll('[data-tab-btn]').forEach((b) => b.classList.toggle('active', b === btn));
      document.querySelectorAll('section[data-tab]').forEach((s) => s.classList.toggle('current', s.dataset.tab === btn.dataset.tabBtn));
    };
  });
  $('buy').onclick = () => placeOrder('buy');
  $('sell').onclick = () => placeOrder('sell');
  for (const key of ['buyHold', 'dca']) {
    $(`show-${key}`).onchange = (e) => { showBenchmark[key] = e.target.checked; };
  }
  const pct = (r) => `${r > 0 ? '+' : ''}${(r * 100).toFixed(2)}%`;

  let shownTrades = -1;
  function updatePanel() {
    if (validQty()) {
      const b = game.quote('buy', qty()), s = game.quote('sell', qty());
      $('estimate').textContent =
        `預估成交金額 ${money(b.amount)}；買進手續費 ${b.fee}；賣出手續費 ${s.fee}、證交稅 ${s.tax}`;
    } else {
      $('estimate').textContent = '';
    }

    const a = game.account();
    $('pos-shares').textContent = a.shares.toLocaleString('zh-TW');
    $('pos-avg').textContent = a.shares > 0 ? a.avgCost.toFixed(2) : '-';
    $('pos-cash').textContent = money(a.cash);
    $('pos-total').textContent = money(a.totalAssets);
    $('pos-unrealized').textContent = money(a.unrealizedPnl);
    $('pos-realized').textContent = money(a.realizedPnl);

    const r = game.returns();
    $('ret-user').textContent = pct(r.user);
    $('ret-bar').textContent = pct(r.user);
    for (const key of ['buyHold', 'dca']) $(`ret-${key}`).textContent = showBenchmark[key] ? pct(r[key]) : '-';

    const trades = game.trades();
    if (trades.length !== shownTrades) {
      shownTrades = trades.length;
      $('trades').innerHTML = trades.reverse().map((t) =>
        `<tr><td>${t.day + 1}</td><td>${t.side === 'buy' ? '買' : '賣'}</td><td>${t.shares}</td>` +
        `<td>${t.price.toFixed(2)}</td><td>${t.fee}</td><td>${t.tax}</td></tr>`).join('');
    }
  }

  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  const latestBtn = document.getElementById('latest');

  // 可視範圍：count 是可視 K 棒數（Infinity 表示全部）；start 是最左側的 K 棒索引，可為小數，null 表示跟隨最新的 K 棒
  const view = { count: 80, start: null };
  let hoverX = null;
  let drag = null;

  const plotWidth = () => canvas.clientWidth - AXIS_W;
  const visibleCount = (n) => Math.min(view.count, n);
  const viewStart = (n) => (view.start === null ? n - visibleCount(n) : view.start);
  function setStart(start, n) {
    const max = n - visibleCount(n);
    const clamped = Math.max(0, start);
    view.start = clamped >= max ? null : clamped;
  }

  latestBtn.onclick = () => { view.start = null; };

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const n = game.candles().length;
    const mx = Math.min(e.offsetX, plotWidth());
    // 未跟隨時，游標下的 K 棒位置在縮放前後保持不動；跟隨時固定最右側為最新的 K 棒
    const anchor = viewStart(n) + (mx / plotWidth()) * visibleCount(n);
    const deltaY = e.deltaMode === WheelEvent.DOM_DELTA_LINE ? e.deltaY * 33 : e.deltaY; // Firefox 以行為單位
    const next = Math.max(MIN_VISIBLE, visibleCount(n) * Math.exp(deltaY * 0.001));
    view.count = next >= n ? Infinity : next;
    if (view.start !== null) setStart(anchor - (mx / plotWidth()) * visibleCount(n), n);
  }, { passive: false });

  canvas.addEventListener('mousedown', (e) => {
    drag = { x: e.clientX, start: null }; // 起點等到真的移動才記錄，避免按下後才長出的 K 棒讓畫面跳一格
    canvas.classList.add('dragging');
  });
  window.addEventListener('mousemove', (e) => {
    if (!drag || e.clientX === drag.x) return;
    const n = game.candles().length;
    if (drag.start === null) drag.start = viewStart(n);
    setStart(drag.start - ((e.clientX - drag.x) / plotWidth()) * visibleCount(n), n);
  });
  window.addEventListener('mouseup', () => {
    drag = null;
    canvas.classList.remove('dragging');
  });
  canvas.addEventListener('mousemove', (e) => { hoverX = e.offsetX; });

  // 觸控：單指左右拖曳平移、兩指縮放、長按顯示 K 棒詳情
  const LONG_PRESS_MS = 500, TOUCH_SLOP = 8;
  let touch = null; // mode：pending（剛按下）、pan、press（長按中）、pinch
  const touchX = (t) => t.clientX - canvas.getBoundingClientRect().left;
  const pinchInfo = (a, b) => ({
    dist: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) || 1,
    mid: Math.min((touchX(a) + touchX(b)) / 2, plotWidth()),
  });
  // 只計算放在圖表上的手指（targetTouches），按著底部按鈕的手指不算
  function startPinch(e) {
    const n = game.candles().length;
    const { dist, mid } = pinchInfo(e.targetTouches[0], e.targetTouches[1]);
    touch = { mode: 'pinch', dist, count: visibleCount(n), anchor: viewStart(n) + (mid / plotWidth()) * visibleCount(n) };
  }
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (touch) clearTimeout(touch.timer);
    hoverX = null;
    if (e.targetTouches.length >= 2) { startPinch(e); return; }
    const t = e.targetTouches[0];
    touch = { mode: 'pending', x: touchX(t), y: t.clientY };
    touch.timer = setTimeout(() => {
      if (touch && touch.mode === 'pending') { touch.mode = 'press'; hoverX = touch.x; }
    }, LONG_PRESS_MS);
  }, { passive: false });
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (!touch) return;
    const n = game.candles().length;
    if (touch.mode === 'pinch') {
      if (e.targetTouches.length < 2) return;
      const { dist, mid } = pinchInfo(e.targetTouches[0], e.targetTouches[1]);
      // 和滾輪縮放相同：跟隨時固定最右側為最新的 K 棒，未跟隨時兩指中點下的 K 棒保持不動
      const next = Math.max(MIN_VISIBLE, touch.count * (touch.dist / dist));
      view.count = next >= n ? Infinity : next;
      if (view.start !== null) setStart(touch.anchor - (mid / plotWidth()) * visibleCount(n), n);
      return;
    }
    const t = e.targetTouches[0];
    const x = touchX(t);
    if (touch.mode === 'press') { hoverX = x; return; }
    if (touch.mode === 'pending') {
      if (Math.hypot(x - touch.x, t.clientY - touch.y) < TOUCH_SLOP) return;
      clearTimeout(touch.timer);
      touch = { mode: 'pan', x, start: viewStart(n) };
    }
    setStart(touch.start - ((x - touch.x) / plotWidth()) * visibleCount(n), n);
  }, { passive: false });
  function endTouch(e) {
    e.preventDefault();
    if (!touch) return;
    clearTimeout(touch.timer);
    hoverX = null;
    // 放開後剩下的手指重新起算手勢，避免畫面跳動
    if (e.targetTouches.length === 0) touch = null;
    else if (e.targetTouches.length >= 2) startPinch(e);
    else touch = { mode: 'pan', x: touchX(e.targetTouches[0]), start: viewStart(game.candles().length) };
  }
  canvas.addEventListener('touchend', endTouch, { passive: false });
  canvas.addEventListener('touchcancel', endTouch, { passive: false });
  canvas.addEventListener('mouseleave', () => { hoverX = null; });

  function draw() {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== w * dpr || canvas.height !== h * dpr) {
      canvas.width = w * dpr;
      canvas.height = h * dpr;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    const all = game.candles();
    const n = all.length;
    const count = visibleCount(n);
    const start = viewStart(n);
    const first = Math.max(0, Math.floor(start));
    const visible = all.slice(first, Math.min(n, Math.ceil(start + count)));
    const plotW = plotWidth();
    const priceH = h * 0.6, volTop = priceH + 8, volBottom = h * 0.75, volH = volBottom - volTop;
    const eqTop = volBottom + 8, eqH = h - eqTop;
    let hi = -Infinity, lo = Infinity, maxVol = 0;
    for (const c of visible) {
      hi = Math.max(hi, c.high);
      lo = Math.min(lo, c.low);
      maxVol = Math.max(maxVol, c.volume);
    }
    const pad = (hi - lo) * 0.05;
    hi += pad; lo -= pad;
    const y = (p) => ((hi - p) / (hi - lo)) * priceH;
    const slot = plotW / count;
    const bodyW = Math.max(1, slot * 0.7);

    // 價格軸
    ctx.fillStyle = '#888';
    ctx.font = '11px system-ui';
    ctx.strokeStyle = '#222';
    for (let i = 0; i <= 5; i++) {
      const p = lo + ((hi - lo) * i) / 5;
      const yy = y(p);
      ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(plotW, yy); ctx.stroke();
      ctx.fillText(p.toFixed(2), plotW + 6, yy + 4);
    }

    const xOf = (index) => (index - start) * slot + slot / 2;

    // 資產曲線：Y 軸是報酬率 %，從 0% 起算；預產的歷史區段沒有資料，自然留白
    const series = ['user', 'buyHold', 'dca'].filter((k) => k === 'user' || showBenchmark[k]);
    const curve = game.equityCurve();
    const curveFrom = curve.length ? curve[0].day : n;
    // 多取左右各一點，讓線延伸到窗格邊緣
    const curveVisible = curve.slice(Math.max(0, first - 1 - curveFrom), Math.max(0, first + visible.length + 1 - curveFrom));
    let eqHi = 0, eqLo = 0;
    for (const p of curveVisible) {
      if (p.day < first || p.day >= first + visible.length) continue;
      for (const k of series) { eqHi = Math.max(eqHi, p[k]); eqLo = Math.min(eqLo, p[k]); }
    }
    const eqPad = (eqHi - eqLo) * 0.1 || 0.01;
    eqHi += eqPad; eqLo -= eqPad;
    const eqY = (r) => eqTop + ((eqHi - r) / (eqHi - eqLo)) * eqH;
    const eqR = (yy) => eqHi - ((yy - eqTop) / eqH) * (eqHi - eqLo);
    // 第一個即時交易日的左緣補一個 0% 起點，曲線從 0% 起算
    const eqPoints = curveVisible.map((p) => Object.assign({ x: xOf(p.day) }, p));
    if (curveVisible.length && curveVisible[0].day === curveFrom) {
      eqPoints.unshift({ x: xOf(curveFrom) - slot / 2, user: 0, buyHold: 0, dca: 0 });
    }
    ctx.fillStyle = '#888';
    ctx.strokeStyle = '#444';
    ctx.beginPath(); ctx.moveTo(0, eqY(0)); ctx.lineTo(plotW, eqY(0)); ctx.stroke();
    ctx.fillText('0%', plotW + 6, eqY(0) + 4);
    // 窗格上下緣各標一個刻度，太靠近 0% 的不標，避免文字重疊
    for (const yy of [eqTop + 6, h - 6]) {
      if (Math.abs(yy - eqY(0)) > 14) ctx.fillText(pct(eqR(yy)), plotW + 6, yy + 4);
    }
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, plotW, h); ctx.clip(); // 平移到一半的 K 棒不要畫進價格軸

    if (reveal) {
      const markers = game.dayMarkers().slice(first, first + visible.length);
      // 市場狀態：連續相同狀態的區段畫一條背景帶，左上角加文字標籤
      let bandStart = 0;
      for (let i = 1; i <= markers.length; i++) {
        if (i < markers.length && markers[i].state === markers[bandStart].state) continue;
        const band = STATE_BANDS[markers[bandStart].state];
        const left = xOf(first + bandStart) - slot / 2;
        ctx.fillStyle = band.fill;
        ctx.fillRect(left, 0, (i - bandStart) * slot, h);
        ctx.fillStyle = '#aaa';
        ctx.fillText(band.label, Math.max(0, left) + 4, 14); // 區段起點平移出畫面時，標籤留在左緣
        bandStart = i;
      }
      // 跳躍日：K 棒上方加標記
      ctx.fillStyle = '#ffd43b';
      ctx.textAlign = 'center';
      markers.forEach((m, i) => {
        if (m.jump) ctx.fillText('⚡', xOf(first + i), y(visible[i].high) - 6);
      });
      ctx.textAlign = 'start';
    }

    visible.forEach((c, i) => {
      const x = xOf(first + i);
      ctx.fillStyle = ctx.strokeStyle = c.close >= c.open ? UP : DOWN;
      ctx.beginPath(); ctx.moveTo(x, y(c.high)); ctx.lineTo(x, y(c.low)); ctx.stroke();
      const top = y(Math.max(c.open, c.close));
      ctx.fillRect(x - bodyW / 2, top, bodyW, Math.max(1, y(Math.min(c.open, c.close)) - top));
      const vh = (c.volume / maxVol) * volH;
      ctx.fillRect(x - bodyW / 2, volBottom - vh, bodyW, vh);
    });

    // 買賣點：▲ 買標在 K 棒下方，▼ 賣標在 K 棒上方
    ctx.font = '12px system-ui';
    ctx.textAlign = 'center';
    for (const t of game.trades()) {
      const c = visible[t.day - first];
      if (!c) continue;
      const x = xOf(t.day);
      ctx.fillStyle = '#fcc419';
      if (t.side === 'buy') ctx.fillText('▲', x, y(c.low) + 14);
      else ctx.fillText('▼', x, y(c.high) - 4);
    }
    ctx.textAlign = 'start';

    ctx.lineWidth = 1.5;
    for (const k of series) {
      ctx.strokeStyle = SERIES_COLORS[k];
      ctx.beginPath();
      eqPoints.forEach((p, i) => (i ? ctx.lineTo : ctx.moveTo).call(ctx, p.x, eqY(p[k])));
      ctx.stroke();
    }
    ctx.lineWidth = 1;
    ctx.restore();

    // 滑鼠所在 K 棒的詳細數字
    const hovered = hoverX !== null && hoverX < plotW && !drag ? Math.floor(start + hoverX / slot) : -1;
    if (hovered >= 0 && hovered < n) {
      const c = all[hovered];
      const x = xOf(hovered);
      ctx.strokeStyle = '#666';
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      const text = `交易日 ${hovered + 1}　開 ${c.open.toFixed(2)}　高 ${c.high.toFixed(2)}　低 ${c.low.toFixed(2)}　收 ${c.close.toFixed(2)}　量 ${c.volume}`;
      ctx.font = '12px system-ui';
      // 窄螢幕放不下一行時拆成兩行
      const lines = ctx.measureText(text).width + 20 > w
        ? [`交易日 ${hovered + 1}　量 ${c.volume}`, `開 ${c.open.toFixed(2)}　高 ${c.high.toFixed(2)}　低 ${c.low.toFixed(2)}　收 ${c.close.toFixed(2)}`]
        : [text];
      ctx.fillStyle = 'rgba(17, 17, 17, 0.85)';
      ctx.fillRect(4, 4, Math.max(...lines.map((l) => ctx.measureText(l).width)) + 12, 6 + lines.length * 16);
      ctx.fillStyle = '#ddd';
      lines.forEach((l, i) => ctx.fillText(l, 10, 19 + i * 16));
    }

    latestBtn.hidden = view.start === null;

    document.getElementById('price').textContent = game.price().toFixed(2);
    const change = n > 1 ? game.price() / all[n - 2].close - 1 : 0; // 相對前一交易日收盤
    $('change').textContent = pct(change);
    $('change').style.color = change > 0 ? UP : change < 0 ? DOWN : '';
    updatePanel();
  }

  function frame(now) {
    if (lastTime !== null && playing) {
      const dt = Math.min(now - lastTime, 100); // 分頁切回來時不要一次補一大堆 tick
      pendingTicks += (dt * TICKS_PER_DAY * speed) / MS_PER_DAY_1X;
      while (pendingTicks >= 1) {
        game.tick();
        pendingTicks--;
      }
    }
    lastTime = now;
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
